name: Deploy MAX bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /opt/bots/max-barbershop-bot
      SERVICE_NAME: max-barbershop-bot.service
      TELEGRAM_SERVICE_NAME: telegram-bot@max-barbershop-bot.service
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SERVER_PORT}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy MAX bot on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          DEV_MAX_USER_ID: ${{ secrets.DEV_MAX_USER_ID }}
          DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
          SUPPORT_USERNAME: ${{ secrets.SUPPORT_USERNAME }}
          REMINDERS_ENABLED: ${{ secrets.REMINDERS_ENABLED }}
          REMINDERS_POLL_INTERVAL_SECONDS: ${{ secrets.REMINDERS_POLL_INTERVAL_SECONDS }}
          BROADCAST_SEND_DELAY_SECONDS: ${{ secrets.BROADCAST_SEND_DELAY_SECONDS }}
          BROADCAST_BATCH_SIZE: ${{ secrets.BROADCAST_BATCH_SIZE }}
          BROADCAST_BATCH_PAUSE_SECONDS: ${{ secrets.BROADCAST_BATCH_PAUSE_SECONDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DB_PATH: ${{ secrets.TELEGRAM_DB_PATH }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          ssh -p "${SERVER_PORT}" -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" \
            APP_DIR="${APP_DIR}" \
            SERVICE_NAME="${SERVICE_NAME}" \
            TELEGRAM_SERVICE_NAME="${TELEGRAM_SERVICE_NAME}" \
            REPO_URL="${REPO_URL}" \
            MAX_BOT_TOKEN="${MAX_BOT_TOKEN}" \
            DEV_MAX_USER_ID="${DEV_MAX_USER_ID}" \
            DATABASE_PATH="${DATABASE_PATH:-/opt/bots/max-barbershop-bot/data/max_barbershop_bot.sqlite3}" \
            SUPPORT_USERNAME="${SUPPORT_USERNAME:-@XXX}" \
            REMINDERS_ENABLED="${REMINDERS_ENABLED:-false}" \
            REMINDERS_POLL_INTERVAL_SECONDS="${REMINDERS_POLL_INTERVAL_SECONDS:-300}" \
            BROADCAST_SEND_DELAY_SECONDS="${BROADCAST_SEND_DELAY_SECONDS:-0.1}" \
            BROADCAST_BATCH_SIZE="${BROADCAST_BATCH_SIZE:-20}" \
            BROADCAST_BATCH_PAUSE_SECONDS="${BROADCAST_BATCH_PAUSE_SECONDS:-1.0}" \
            TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN}" \
            TELEGRAM_DB_PATH="${TELEGRAM_DB_PATH}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          sudo mkdir -p "${APP_DIR}" "${APP_DIR}/data"
          sudo chown -R "$(id -u):$(id -g)" "${APP_DIR}"

          if [ -d "${APP_DIR}/.git" ]; then
            git -C "${APP_DIR}" fetch --depth=1 "${REPO_URL}" main
            git -C "${APP_DIR}" reset --hard FETCH_HEAD
          else
            tmp_dir="$(mktemp -d)"
            git clone --depth=1 "${REPO_URL}" "${tmp_dir}"
            rsync -a --exclude .env --exclude data/ "${tmp_dir}/" "${APP_DIR}/"
            rm -rf "${tmp_dir}"
          fi

          mkdir -p "${APP_DIR}/data"
          python3 -m venv "${APP_DIR}/.venv"
          "${APP_DIR}/.venv/bin/python" -m pip install --upgrade pip
          if [ -f "${APP_DIR}/requirements.txt" ]; then
            "${APP_DIR}/.venv/bin/python" -m pip install -r "${APP_DIR}/requirements.txt"
          fi

          umask 077
          touch "${APP_DIR}/.env"
          chmod 600 "${APP_DIR}/.env"
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(os.environ["APP_DIR"]) / ".env"
          updates = {
              "MAX_BOT_TOKEN": os.environ["MAX_BOT_TOKEN"],
              "DEV_MAX_USER_ID": os.environ["DEV_MAX_USER_ID"],
              "DATABASE_PATH": os.environ["DATABASE_PATH"],
              "SUPPORT_USERNAME": os.environ["SUPPORT_USERNAME"],
              "REMINDERS_ENABLED": os.environ["REMINDERS_ENABLED"],
              "REMINDERS_POLL_INTERVAL_SECONDS": os.environ["REMINDERS_POLL_INTERVAL_SECONDS"],
              "BROADCAST_SEND_DELAY_SECONDS": os.environ["BROADCAST_SEND_DELAY_SECONDS"],
              "BROADCAST_BATCH_SIZE": os.environ["BROADCAST_BATCH_SIZE"],
              "BROADCAST_BATCH_PAUSE_SECONDS": os.environ["BROADCAST_BATCH_PAUSE_SECONDS"],
              "TELEGRAM_BOT_TOKEN": os.environ["TELEGRAM_BOT_TOKEN"],
              "TELEGRAM_DB_PATH": os.environ["TELEGRAM_DB_PATH"],
          }

          lines = env_path.read_text().splitlines() if env_path.exists() else []
          written = set()
          next_lines = []

          for line in lines:
              key, sep, _ = line.partition("=")
              if sep and key in updates:
                  if key not in written:
                      next_lines.append(f"{key}={updates[key]}")
                      written.add(key)
                  continue
              next_lines.append(line)

          for key, value in updates.items():
              if key not in written:
                  next_lines.append(f"{key}={value}")

          env_path.write_text("\n".join(next_lines) + "\n")
          PY
          chmod 600 "${APP_DIR}/.env"

          sudo install -m 0644 "${APP_DIR}/scripts/systemd/${SERVICE_NAME}" "/etc/systemd/system/${SERVICE_NAME}"
          sudo systemctl daemon-reload
          sudo systemctl enable "${SERVICE_NAME}"
          sudo systemctl restart "${SERVICE_NAME}"
          sudo systemctl restart "${TELEGRAM_SERVICE_NAME}"
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(os.environ["APP_DIR"]) / ".env"
          values = {}
          for line in env_path.read_text().splitlines():
              key, sep, value = line.partition("=")
              if sep:
                  values[key] = value

          telegram_db_path = values.get("TELEGRAM_DB_PATH", "")
          print(f"TELEGRAM_BOT_TOKEN={'configured' if values.get('TELEGRAM_BOT_TOKEN') else 'missing'}")
          print(f"TELEGRAM_DB_PATH={'configured' if telegram_db_path else 'missing'}")
          print(f"TELEGRAM_DB_PATH_EXISTS={'yes' if telegram_db_path and Path(telegram_db_path).exists() else 'no'}")
          PY
          sudo systemctl status "${SERVICE_NAME}" --no-pager
          sudo journalctl -u "${SERVICE_NAME}" -n 100 --no-pager
          REMOTE
